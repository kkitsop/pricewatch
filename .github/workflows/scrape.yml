name: Daily Price Scraper

on:
  schedule:
    - cron: '0 23 * * *'  # Κάθε βράδυ στις 02:00 ώρα Ελλάδας
  workflow_dispatch:        # Επιτρέπει χειροκίνητη εκτέλεση

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright beautifulsoup4
          playwright install chromium

      - name: Run scraper
        run: python scraper_gh.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'pricewatch-68f'  # Επιβεβαίωσε ότι αυτό είναι το όνομα του project στο Cloudflare Dashboard
          directory: '.'
